name: WOLF Bot

on:
  workflow_dispatch:

jobs:
  wolf:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ============================================================
      # Google Chrome الرسمي
      # ============================================================
      - name: Install Google Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true


      # ============================================================
      # التأكد من Chrome
      # ============================================================
      - name: Check Google Chrome
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "========================================"
          echo "Google Chrome"
          echo "========================================"

          echo "Chrome path:"
          echo "$CHROME_PATH"

          echo ""
          echo "Chrome version:"
          "$CHROME_PATH" --version

          echo ""
          echo "System Chrome:"
          which google-chrome || true

          google-chrome --version || true

          echo "========================================"


      # ============================================================
      # تثبيت Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          echo "========================================"
          echo "Installing npm dependencies"
          echo "========================================"

          npm install

          echo "========================================"
          echo "npm install completed"
          echo "========================================"


      # ============================================================
      # تشغيل WOLF
      # ============================================================
      - name: Start WOLF
        env:
          WOLF_EMAIL: ${{ secrets.WOLF_EMAIL }}
          WOLF_PASSWORD: ${{ secrets.WOLF_PASSWORD }}

          # مسار Google Chrome الرسمي
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

        run: |
          echo "========================================"
          echo "Starting WOLF Bot"
          echo "========================================"

          echo "Chrome:"
          "$CHROME_PATH" --version

          echo ""
          echo "Chrome path:"
          echo "$CHROME_PATH"

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo "========================================"

          npm start
