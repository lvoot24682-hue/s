name: WOLF Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"   # كل 4 ساعات

concurrency:
  group: wolf-bot
  cancel-in-progress: true

jobs:
  wolf:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # Setup Node.js
      # ======================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ======================================================
      # ★ Install FFmpeg (مطلوب للـ Stage)
      # ======================================================
      - name: Install FFmpeg
        run: |
          echo "🎬 Installing FFmpeg..."
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo ""
          echo "🔎 التحقق من التثبيت..."
          which ffmpeg
          ffmpeg -version | head -n 1
          echo "✅ FFmpeg installed successfully"

      # ======================================================
      # ★ استرجاع البروفايل من الكاش
      # ======================================================
      - name: Restore WOLF profile from cache
        id: profile-cache
        uses: actions/cache/restore@v4
        with:
          path: ./wolf-runtime
          key: wolf-profile-cache-${{ github.run_id }}
          restore-keys: |
            wolf-profile-cache-

      - name: Profile cache status
        run: |
          if [ -d "./wolf-runtime/profile" ] && [ -n "$(ls -A ./wolf-runtime/profile 2>/dev/null)" ]; then
            echo "✅ Cache موجود — سيتم استخدام البروفايل المُحدَّث"
          else
            echo "ℹ️ لا يوجد Cache — سيتم التنزيل من Google Drive"
          fi

      # ======================================================
      # Install Dependencies
      # ======================================================
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm install
          echo "🌐 Installing Playwright Chromium..."
          npx playwright install --with-deps chromium
          echo "✅ Dependencies installed"

      # ======================================================
      # Check WOLF Profile Secret
      # ======================================================
      - name: Check WOLF Profile Secret
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL is NOT available"
            exit 1
          fi
          echo "✅ WOLF_PROFILE_URL is available"

      # ======================================================
      # Start WOLF Bot
      # ======================================================
      - name: Start WOLF Bot
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: |
          echo "🐺 WOLF BOT STARTING"
          echo "🕐 Start time: $(date)"
          echo "🎬 FFMPEG: $(which ffmpeg)"
          echo "========================================"

          RUN_SECONDS=18000
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + RUN_SECONDS))

          cleanup() {
            echo ""
            echo "🧹 WOLF CLEANUP"
            echo "🛑 Stopping WOLF..."
            if [ -n "$BOT_PID" ] && kill -0 "$BOT_PID" 2>/dev/null; then
              kill -TERM -- "-$BOT_PID" 2>/dev/null || true
              sleep 8
              if kill -0 "$BOT_PID" 2>/dev/null; then
                kill -KILL -- "-$BOT_PID" 2>/dev/null || true
              fi
            fi
            echo "✅ WOLF cleanup completed"
          }

          trap cleanup EXIT INT TERM

          echo "🚀 STARTING WOLF"
          setsid npm start &
          BOT_PID=$!
          echo "🐺 WOLF PID: $BOT_PID"

          while true; do
            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "⏰ 5 HOURS COMPLETED at $(date)"
              exit 0
            fi

            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "⚠️ WOLF STOPPED UNEXPECTEDLY"
              wait "$BOT_PID" 2>/dev/null || true
              exit 1
            fi

            ELAPSED=$((NOW - START_TIME))
            H=$((ELAPSED / 3600))
            M=$(((ELAPSED % 3600) / 60))
            S=$((ELAPSED % 60))
            echo "🐺 WOLF is running | ⏱️ ${H}h ${M}m ${S}s | $(date)"
            sleep 30
          done

      # ======================================================
      # ★ حفظ البروفايل في الكاش
      # ======================================================
      - name: Save WOLF profile to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./wolf-runtime
          key: wolf-profile-cache-${{ github.run_id }}

      # ======================================================
      # Final Cleanup
      # ======================================================
      - name: Final Cleanup
        if: always()
        run: |
          echo "🧹 FINAL CLEANUP"
          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true
          echo "✅ Final cleanup completed"
