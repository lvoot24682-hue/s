name: WOLF Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: wolf-bot
  cancel-in-progress: true

jobs:
  wolf:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install System Dependencies
        run: |
          echo ""
          echo "========================================"
          echo "🎬 Installing System Dependencies"
          echo "========================================"
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          echo ""
          echo "✅ System Dependencies installed successfully"
          echo "========================================"

      - name: Install dependencies
        run: |
          echo ""
          echo "📦 Installing dependencies"
          npm install
          npx playwright install chromium
          npx playwright install-deps chromium
          echo ""
          echo "✅ Dependencies installed"

      - name: Check WOLF Profile Secret
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL is NOT available"
            exit 1
          fi
          echo "✅ WOLF_PROFILE_URL is available"

      - name: Start WOLF Bot
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          echo ""
          echo "🐺 WOLF BOT STARTING"
          echo "🕐 Start time: $(date)"
          echo "⏱️ Maximum runtime: 5 hours"
          echo "========================================"

          RUN_SECONDS=18000
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + RUN_SECONDS))

          cleanup() {
            echo ""
            echo "🧹 WOLF CLEANUP"
            echo "🛑 Stopping WOLF..."
            if [ -n "$BOT_PID" ]; then
              if kill -0 "$BOT_PID" 2>/dev/null; then
                echo "📡 Sending SIGTERM..."
                kill -TERM -- "-$BOT_PID" 2>/dev/null || true
                sleep 5
                if kill -0 "$BOT_PID" 2>/dev/null; then
                  echo "💀 Sending SIGKILL..."
                  kill -KILL -- "-$BOT_PID" 2>/dev/null || true
                fi
              else
                echo "ℹ️ WOLF process already stopped"
              fi
            fi
            echo "✅ WOLF cleanup completed"
          }

          trap cleanup EXIT
          trap cleanup INT
          trap cleanup TERM

          echo "🚀 STARTING WOLF"
          # ✅ تشغيل البوت باستخدام xvfb-run لتوفير شاشة وهمية
          setsid xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" npm start &
          BOT_PID=$!

          echo "🐺 WOLF PID: $BOT_PID"
          echo "🕐 Started: $(date)"

          while true; do
            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "⏰ 5 HOURS COMPLETED. Stopping WOLF..."
              exit 0
            fi

            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "⚠️ WOLF STOPPED UNEXPECTEDLY"
              wait "$BOT_PID" 2>/dev/null || true
              exit 1
            fi

            ELAPSED=$((NOW - START_TIME))
            HOURS=$((ELAPSED / 3600))
            MINUTES=$(((ELAPSED % 3600) / 60))
            SECONDS=$((ELAPSED % 60))

            echo "🐺 WOLF is running | ⏱️ Runtime: ${HOURS}h ${MINUTES}m ${SECONDS}s"
            sleep 30
          done

      - name: Final Cleanup
        if: always()
        run: |
          echo "🧹 FINAL CLEANUP"
          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true
          pkill -TERM -f "Xvfb" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "Xvfb" 2>/dev/null || true
          echo "✅ Final cleanup completed"
