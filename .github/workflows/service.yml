name: WOLF Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # تم التعديل: العمل كل 6 ساعات

concurrency:
  group: wolf-bot
  cancel-in-progress: true

jobs:
  wolf:
    runs-on: ubuntu-latest

    # 5 ساعات و 55 دقيقة (هامش أمان للحد الأقصى في GitHub وهو 6 ساعات)
    timeout-minutes: 355

    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # Node.js
      # ======================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ======================================================
      # FFmpeg
      # ======================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      # ======================================================
      # Dependencies
      # ======================================================
      - name: Install dependencies
        run: |
          npm install

      # ======================================================
      # ★ Restore WOLF Profile from Cache
      # ======================================================
      - name: Restore WOLF profile from cache
        id: profile-cache
        uses: actions/cache/restore@v4
        with:
          path: ./wolf-runtime
          key: wolf-profile-${{ github.run_id }}
          restore-keys: |
            wolf-profile-

      - name: Profile cache status
        run: |
          if [ -d "./wolf-runtime/profile" ] && [ -n "$(ls -A ./wolf-runtime/profile 2>/dev/null)" ]; then
            echo "✅ Cache موجود — سيتم استخدام البروفايل المُحدَّث"
            du -sh ./wolf-runtime/profile || true
          else
            echo "ℹ️ لا يوجد Cache — سيتم التنزيل من Google Drive"
          fi

      # ======================================================
      # Check Secret
      # ======================================================
      - name: Check WOLF Profile Secret
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL is NOT available"
            exit 1
          fi
          echo "✅ WOLF_PROFILE_URL is available"

      # ======================================================
      # Start WOLF
      # ======================================================
      - name: Start WOLF Bot
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          echo "🕐 Start time: $(date -u)"
          echo "⏱️ Maximum runtime: 5 hours 45 minutes"
          echo "🔄 New run every 6 hours cancels this one automatically"
          echo "📱 DEVICE: web"
          echo "🛡️ APP CHECK: true"
          echo "========================================"

          # تم التعديل: 20700 ثانية = 5 ساعات و 45 دقيقة
          RUN_SECONDS=20700
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + RUN_SECONDS))

          cleanup() {
            echo ""
            echo "🧹 WOLF CLEANUP"
            echo "🛑 Stopping WOLF..."

            if [ -n "$BOT_PID" ]; then
              if kill -0 "$BOT_PID" 2>/dev/null; then
                echo "🐺 WOLF PID: $BOT_PID"
                echo "📡 Sending SIGTERM..."
                kill -TERM -- "-$BOT_PID" 2>/dev/null || true
                sleep 8

                if kill -0 "$BOT_PID" 2>/dev/null; then
                  echo "⚠️ WOLF still running"
                  echo "💀 Sending SIGKILL..."
                  kill -KILL -- "-$BOT_PID" 2>/dev/null || true
                fi
              else
                echo "ℹ️ WOLF process already stopped"
              fi
            fi

            echo "✅ WOLF cleanup completed"
          }

          trap cleanup EXIT INT TERM

          echo "🚀 STARTING WOLF at $(date -u)"

          # Process group منفصلة ليتم قتل الشجرة كاملة
          setsid npm start &
          BOT_PID=$!

          echo "🐺 WOLF PID: $BOT_PID"

          while true; do
            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_TIME" ]; then
              echo ""
              echo "⏰ 5 HOURS 45 MINUTES COMPLETED at $(date -u)"
              exit 0
            fi

            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo ""
              echo "⚠️ WOLF STOPPED UNEXPECTEDLY"
              wait "$BOT_PID" 2>/dev/null || true
              exit 1
            fi

            ELAPSED=$((NOW - START_TIME))
            HOURS=$((ELAPSED / 3600))
            MINUTES=$(((ELAPSED % 3600) / 60))
            SECONDS=$((ELAPSED % 60))

            echo "🐺 WOLF running | ⏱️ ${HOURS}h ${MINUTES}m ${SECONDS}s | $(date -u)"
            sleep 30
          done

      # ======================================================
      # ★ Save WOLF Profile to Cache
      # ======================================================
      - name: Save WOLF profile to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./wolf-runtime
          key: wolf-profile-${{ github.run_id }}

      # ======================================================
      # Final Cleanup
      # ======================================================
      - name: Final Cleanup
        if: always()
        run: |
          echo "🧹 FINAL CLEANUP"
          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true
          echo "✅ Final cleanup completed"
