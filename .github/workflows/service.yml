name: WOLF Bot

on:
  workflow_dispatch:

jobs:
  wolf:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      # ============================================
      # تحميل المشروع
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # Node.js
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================
      # Google Chrome الرسمي
      # ============================================
      - name: Install Google Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      # ============================================
      # التأكد من Chrome
      # ============================================
      - name: Check Chrome
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "========================================"
          echo "Google Chrome"
          echo "========================================"

          echo "Chrome path:"
          echo "$CHROME_PATH"

          echo ""
          echo "Chrome version:"
          "$CHROME_PATH" --version

          echo ""
          echo "System google-chrome:"
          which google-chrome || true

          google-chrome --version || true

          echo "========================================"

      # ============================================
      # تثبيت npm
      # ============================================
      - name: Install dependencies
       run: npm install

      # ============================================
      # تشغيل البوت
      # ============================================
      - name: Start WOLF
        env:
          WOLF_EMAIL: ${{ secrets.WOLF_EMAIL }}
          WOLF_PASSWORD: ${{ secrets.WOLF_PASSWORD }}

          # مسار Chrome الرسمي
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

        run: |
          echo "========================================"
          echo "Starting WOLF"
          echo "========================================"

          echo "Using Chrome:"
          "$CHROME_PATH" --version

          echo "Chrome path:"
          echo "$CHROME_PATH"

          echo "========================================"

          npm start
