name: WOLF Bot

on:
  workflow_dispatch:

concurrency:
  group: wolf-bot
  cancel-in-progress: true

jobs:
  wolf:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # Setup Node.js
      # ======================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ======================================================
      # Install FFmpeg
      # ======================================================
      - name: Install FFmpeg
        run: |
          echo "🎬 Installing FFmpeg..."
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo ""
          echo "🔎 التحقق من التثبيت..."
          which ffmpeg
          ffmpeg -version | head -n 1
          echo "✅ FFmpeg installed successfully"

      # ======================================================
      # Install Dependencies
      # ======================================================
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm install
          echo "✅ Dependencies installed"

      # ======================================================
      # Verify WOLF_TOKENS_PAT
      # ======================================================
      - name: Verify WOLF_TOKENS_PAT
        env:
          WOLF_TOKENS_PAT: ${{ secrets.WOLF_TOKENS_PAT }}
        run: |
          echo "========================================"
          echo "🔐 Verifying WOLF_TOKENS_PAT"
          echo "========================================"

          if [ -z "$WOLF_TOKENS_PAT" ]; then
            echo "❌ WOLF_TOKENS_PAT is NOT available"
            exit 1
          fi
          echo "✅ WOLF_TOKENS_PAT is available"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $WOLF_TOKENS_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/anaayaar-ops/too/contents/tokens.json")

          if [ "$STATUS" != "200" ]; then
            echo "❌ Failed to access too/tokens.json: HTTP $STATUS"
            exit 1
          fi
          echo "✅ Access to too/tokens.json confirmed"

      # ======================================================
      # Start WOLF Bot
      # ======================================================
      - name: Start WOLF Bot
        env:
          WOLF_TOKENS_PAT: ${{ secrets.WOLF_TOKENS_PAT }}
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: |
          echo "🐺 WOLF BOT STARTING"
          echo "📦 Tokens from: anaayaar-ops/too"
          echo "🕐 Start time: $(date)"
          echo "🎬 FFMPEG: $(which ffmpeg)"
          echo "========================================"

          RUN_SECONDS=18000
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + RUN_SECONDS))

          cleanup() {
            echo ""
            echo "🧹 WOLF CLEANUP"
            echo "🛑 Stopping WOLF..."
            if [ -n "$BOT_PID" ] && kill -0 "$BOT_PID" 2>/dev/null; then
              kill -TERM -- "-$BOT_PID" 2>/dev/null || true
              sleep 8
              if kill -0 "$BOT_PID" 2>/dev/null; then
                kill -KILL -- "-$BOT_PID" 2>/dev/null || true
              fi
            fi
            echo "✅ WOLF cleanup completed"
          }

          trap cleanup EXIT INT TERM

          echo "🚀 STARTING WOLF"
          setsid npm start &
          BOT_PID=$!
          echo "🐺 WOLF PID: $BOT_PID"

          while true; do
            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "⏰ 5 HOURS COMPLETED at $(date)"
              exit 0
            fi

            if ! kill -0 "$BOT_PID" 2>/dev/null; then
              echo "⚠️ WOLF STOPPED UNEXPECTEDLY"
              wait "$BOT_PID" 2>/dev/null || true
              exit 1
            fi

            ELAPSED=$((NOW - START_TIME))
            H=$((ELAPSED / 3600))
            M=$(((ELAPSED % 3600) / 60))
            S=$((ELAPSED % 60))
            echo "🐺 WOLF is running | ⏱️ ${H}h ${M}m ${S}s | $(date)"
            sleep 30
          done

      # ======================================================
      # Final Cleanup
      # ======================================================
      - name: Final Cleanup
        if: always()
        run: |
          echo "🧹 FINAL CLEANUP"
          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true
          echo "✅ Final cleanup completed"
